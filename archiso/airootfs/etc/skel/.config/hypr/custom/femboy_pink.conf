# ==============================================================================
# FemboyOS Pink Aesthetic Override for end-4/dots-hyprland (illogical-impulse)
# Palette: Astolfo Pastel Pink (#FFB1C8), Hot Pink (#FF69B4), Deep Rose (#1F1018)
# License: FemboyOS Source-Available License v1.0 (BY-NC-NOEDU-NOMED)
# ==============================================================================

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 3
    col.active_border = rgba(ff69b4ff) rgba(ffb1c8ff) rgba(ff1493ff) 45deg
    col.inactive_border = rgba(4a2538aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 18
    active_opacity = 0.94
    inactive_opacity = 0.86

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.05
        brightness = 1.05
        vibrancy = 0.35
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(ff69b466)
        color_inactive = rgba(1f101844)
    }
}

animations {
    enabled = true
    bezier = femboyBounce, 0.05, 0.9, 0.1, 1.08
    bezier = softPink, 0.25, 1.0, 0.5, 1.0
    animation = windows, 1, 5, femboyBounce, popin 80%
    animation = windowsOut, 1, 5, softPink, popin 80%
    animation = border, 1, 10, softPink
    animation = borderangle, 1, 60, softPink, loop
    animation = fade, 1, 5, softPink
    animation = workspaces, 1, 6, femboyBounce, slidevert
}

# Выделение окон Windows 7/10, запущенных через femboy-winrun
windowrulev2 = bordercolor rgba(ff1493ff) rgba(ffb1c8ff) 45deg, class:^(femboyos-winapp)$
windowrulev2 = opacity 0.98 0.94, class:^(femboyos-winapp)$

# Дефолтные обои ОТВАЛ_ЧИПА_GTX_750_BRATAN при старте сессии (поддержка awww/swww)
exec-once = awww-daemon --format xrgb || swww-daemon --format xrgb
exec-once = awww img /usr/share/backgrounds/femboyos/astolfo_bsod_gtx750.jpg --transition-type grow --transition-pos 0.85,0.85 --transition-duration 1.5 || swww img /usr/share/backgrounds/femboyos/astolfo_bsod_gtx750.jpg --transition-type grow --transition-pos 0.85,0.85 --transition-duration 1.5
