name: Build FemboyOS ISO

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build FemboyOS Pink Edition Live ISO (femlive + feminstall)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Update Pacman & Install Build Toolchain
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso grub syslinux edk2-ovmf edk2-shell \
            git base-devel squashfs-tools libisoburn dosfstools mtools \
            python python-pillow

      - name: Checkout FemboyOS Repository
        uses: actions/checkout@v4

      - name: Assemble FemboyOS Profile & Inject Fixes
        run: |
          mkdir -p /tmp/femboyos-profile
          cp -r /usr/share/archiso/configs/releng/* /tmp/femboyos-profile/
          cp -rf archiso/* /tmp/femboyos-profile/
          if [ -f LICENSE ]; then
            install -Dm644 LICENSE /tmp/femboyos-profile/airootfs/usr/share/licenses/femboyos/LICENSE
          fi

          # 1. Remove pre-pacstrap conflicting files & Arch scripts
          rm -f /tmp/femboyos-profile/airootfs/usr/lib/os-release \
                /tmp/femboyos-profile/airootfs/etc/os-release \
                /tmp/femboyos-profile/airootfs/etc/issue \
                /tmp/femboyos-profile/airootfs/root/.zlogin \
                /tmp/femboyos-profile/airootfs/root/.automated_script.sh \
                /tmp/femboyos-profile/airootfs/usr/local/bin/Installation_guide

          # 2. Pure ASCII English /etc/motd (renders 100% cleanly on Linux tty1 console!)
          echo "femboyos" > /tmp/femboyos-profile/airootfs/etc/hostname
          printf "127.0.0.1\tlocalhost femboyos\n::1\t\tlocalhost femboyos\n" > /tmp/femboyos-profile/airootfs/etc/hosts

          cat << 'MOTD_EOF' > /tmp/femboyos-profile/airootfs/etc/motd

            ======================================================================
                         Welcome to FemboyOS Pink Edition (Astolfo GTX 750)
            ======================================================================
             Available commands:
               * femlive        - Start Pink Hyprland GUI, Waybar & BSOD Wallpaper
               * feminstall     - Launch FemboyOS Pink TUI Disk Installer
               * femboy-winrun  - Run Windows 7 / Windows 10 (.exe) applications
            ======================================================================

          MOTD_EOF

          # 3. Inject fixed femlive (deletes hyprland.lua, fixes seatd/logind exit 134, 3-stage VMware GPU)
          mkdir -p /tmp/femboyos-profile/airootfs/usr/local/bin
          cat << 'FEMLIVE_EOF' > /tmp/femboyos-profile/airootfs/usr/local/bin/femlive
          #!/usr/bin/env bash
          set -uo pipefail
          WALLPAPER="/usr/share/backgrounds/femboyos/astolfo_bsod_gtx750.jpg"
          HYPR_DIR="${HOME}/.config/hypr"
          CUSTOM_CONF="${HYPR_DIR}/custom/femboy_pink.conf"
          echo -e "\033[1;35m[*] Starting femlive - FemboyOS Pink Hyprland Session...\033[0m"
          UID_NUM="$(id -u)"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/${UID_NUM}}"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chown "${UID_NUM}:${UID_NUM}" "${XDG_RUNTIME_DIR}" 2>/dev/null || true
          chmod 0700 "${XDG_RUNTIME_DIR}"

          if command -v systemctl >/dev/null 2>&1; then
              systemctl stop seatd.service seatd.socket 2>/dev/null || true
          fi
          rm -f /run/seatd.sock 2>/dev/null || true
          export LIBSEAT_BACKEND=logind

          mkdir -p "${HYPR_DIR}/custom" "${HOME}/.config/waybar" "${HOME}/.config/kitty"
          rm -f "${HYPR_DIR}"/*.lua /root/.config/hypr/*.lua /etc/skel/.config/hypr/*.lua 2>/dev/null || true

          cat << 'PCONF' > "${CUSTOM_CONF}"
          env = WLR_NO_HARDWARE_CURSORS,1
          env = WLR_RENDERER_ALLOW_SOFTWARE,1
          env = AQ_NO_MODIFIERS,1
          env = AQ_NO_ATOMIC,1
          env = AQ_MGPU_NO_EXPLICIT,1
          monitor = ,preferred,auto,1
          debug {
              disable_logs = false
              enable_stdout_logs = true
          }
          cursor {
              no_hardware_cursors = true
          }
          render {
              explicit_sync = 0
              explicit_sync_kms = 0
              direct_scanout = false
          }
          ecosystem {
              no_update_news = true
              no_donation_nag = true
          }
          input {
              kb_layout = us,ru
              kb_options = grp:alt_shift_toggle
              follow_mouse = 1
          }
          general {
              gaps_in = 6
              gaps_out = 12
              border_size = 3
              col.active_border = rgba(ff69b4ff) rgba(ffb1c8ff) rgba(ff1493ff) 45deg
              col.inactive_border = rgba(4a2538aa)
              layout = dwindle
          }
          decoration {
              rounding = 18
              active_opacity = 0.94
              inactive_opacity = 0.86
              blur {
                  enabled = true
                  size = 8
                  passes = 3
              }
              shadow {
                  enabled = true
                  range = 24
                  render_power = 3
                  color = rgba(ff69b466)
                  color_inactive = rgba(1f101844)
              }
          }
          bind = SUPER, Return, exec, kitty
          bind = SUPER, Q, exec, kitty
          bind = SUPER, D, exec, fuzzel
          bind = SUPER, R, exec, fuzzel
          bind = SUPER, I, exec, kitty -e feminstall
          bind = SUPER, C, killactive,
          bind = SUPER, M, exit,
          bind = SUPER, V, togglefloating,
          bind = SUPER, F, fullscreen,
          bind = SUPER, 1, workspace, 1
          bind = SUPER, 2, workspace, 2
          bind = SUPER, 3, workspace, 3
          bind = SUPER, 4, workspace, 4
          bind = SUPER, 5, workspace, 5
          bindm = SUPER, mouse:272, movewindow
          bindm = SUPER, mouse:273, resizewindow
          exec-once = swaybg -i /usr/share/backgrounds/femboyos/astolfo_bsod_gtx750.jpg -m fill
          exec-once = awww-daemon --format xrgb && awww img /usr/share/backgrounds/femboyos/astolfo_bsod_gtx750.jpg --transition-type grow --transition-pos 0.85,0.85 --transition-duration 1.5
          exec-once = waybar
          exec-once = kitty
          PCONF
          cp -f "${CUSTOM_CONF}" "${HYPR_DIR}/hyprland.conf"

          cat << 'WCFG' > "${HOME}/.config/waybar/config.jsonc"
          {
              "layer": "top",
              "position": "top",
              "height": 34,
              "margin-top": 6,
              "margin-left": 12,
              "margin-right": 12,
              "modules-left": ["custom/femboy", "hyprland/workspaces"],
              "modules-center": ["clock"],
              "modules-right": ["custom/installer", "cpu", "memory", "network"],
              "custom/femboy": {
                  "format": "  FemboyOS Pink ",
                  "on-click": "fuzzel"
              },
              "custom/installer": {
                  "format": " [Install OS: feminstall] ",
                  "on-click": "kitty -e feminstall"
              },
              "clock": {
                  "format": "{:%H:%M  %Y-%m-%d}"
              },
              "cpu": {
                  "format": "CPU {usage}%"
              },
              "memory": {
                  "format": "RAM {}%"
              },
              "network": {
                  "format-wifi": "NET {essid}",
                  "format-ethernet": "NET Online",
                  "format-disconnected": "Offline"
              }
          }
          WCFG

          cat << 'WCSS' > "${HOME}/.config/waybar/style.css"
          * {
              font-family: "JetBrainsMono Nerd Font", monospace;
              font-size: 13px;
              font-weight: bold;
          }
          window#waybar {
              background: rgba(31, 16, 24, 0.88);
              border: 2px solid #ff69b4;
              border-radius: 14px;
              color: #ffd9e2;
          }
          #custom-femboy {
              background: #ff69b4;
              color: #1a0f16;
              border-radius: 10px;
              padding: 0 10px;
              margin: 4px;
          }
          #custom-installer {
              background: #ffb1c8;
              color: #1a0f16;
              border-radius: 10px;
              padding: 0 10px;
              margin: 4px;
          }
          #workspaces button {
              color: #ffb1c8;
              padding: 0 8px;
          }
          #workspaces button.active {
              background: #ff1493;
              color: #ffffff;
              border-radius: 8px;
          }
          #clock, #cpu, #memory, #network {
              padding: 0 10px;
              color: #ffd9e2;
          }
          WCSS

          cat << 'KCFG' > "${HOME}/.config/kitty/kitty.conf"
          font_family      JetBrainsMono Nerd Font
          font_size        11.0
          background_opacity 0.90
          background       #1a0f16
          foreground       #ffd9e2
          cursor           #ff69b4
          selection_background #ff69b4
          selection_foreground #1a0f16
          KCFG

          export AQ_NO_MODIFIERS=1
          export AQ_NO_ATOMIC=1
          export AQ_MGPU_NO_EXPLICIT=1
          export WLR_DRM_NO_MODIFIERS=1
          export WLR_NO_HARDWARE_CURSORS=1
          export WLR_RENDERER_ALLOW_SOFTWARE=1
          export XDG_CURRENT_DESKTOP=Hyprland
          export XDG_SESSION_TYPE=wayland
          export XDG_SESSION_DESKTOP=Hyprland

          HYPR_FLAGS=(-c "${CUSTOM_CONF}")
          if [ "${UID_NUM}" -eq 0 ]; then
              HYPR_FLAGS+=(--i-am-really-stupid)
          fi

          run_hypr() {
              if command -v dbus-run-session >/dev/null 2>&1; then
                  dbus-run-session -- Hyprland "${HYPR_FLAGS[@]}"
              else
                  Hyprland "${HYPR_FLAGS[@]}"
              fi
          }

          if [ ! -e /dev/dri/renderD128 ] || grep -qi "vmware" /sys/class/dmi/id/product_name 2>/dev/null; then
              echo -e "\033[1;35m[*] VMware detected - enabling Mesa software OpenGL/EGL (llvmpipe)...\033[0m"
              export LIBGL_ALWAYS_SOFTWARE=1
              export GALLIUM_DRIVER=llvmpipe
          fi

          run_hypr
          EXIT_CODE=$?

          if [ "${EXIT_CODE}" -ne 0 ]; then
              echo -e "\033[1;33m[!] Retrying with software OpenGL (llvmpipe)...\033[0m"
              export LIBGL_ALWAYS_SOFTWARE=1
              export GALLIUM_DRIVER=llvmpipe
              export EGL_PLATFORM=gbm
              run_hypr
              EXIT_CODE=$?
          fi

          if [ "${EXIT_CODE}" -ne 0 ] && command -v cage >/dev/null 2>&1; then
              echo -e "\033[1;35m[*] Launching via Cage Pixman KMS bridge for unaccelerated VMware...\033[0m"
              unset EGL_PLATFORM
              export WLR_RENDERER=pixman
              export WLR_NO_HARDWARE_CURSORS=1
              exec dbus-run-session -- cage -d -s -- Hyprland "${HYPR_FLAGS[@]}"
          fi
          exit "${EXIT_CODE}"
          FEMLIVE_EOF
          sed -i 's/^          //' /tmp/femboyos-profile/airootfs/usr/local/bin/femlive
          chmod 0755 /tmp/femboyos-profile/airootfs/usr/local/bin/femlive

          # 4. Inject post-pacstrap OS rebranding & English MOTD into customize_airootfs.sh
          mkdir -p /tmp/femboyos-profile/airootfs/root
          cat << 'CUST_EOF' > /tmp/femboyos-profile/airootfs/root/customize_airootfs.sh
          #!/usr/bin/env bash
          set -euo pipefail
          pacman -Rns --noconfirm archinstall 2>/dev/null || true
          rm -f /usr/bin/archinstall /usr/local/bin/Installation_guide /root/.zlogin /root/.automated_script.sh

          echo "femboyos" > /etc/hostname
          printf "127.0.0.1\tlocalhost femboyos\n::1\t\tlocalhost femboyos\n" > /etc/hosts
          printf 'FemboyOS Pink Edition \\r (\\l)\n\n' > /etc/issue

          cat << 'OSREL' > /usr/lib/os-release
          NAME="FemboyOS"
          PRETTY_NAME="FemboyOS Pink Edition"
          ID=femboyos
          ID_LIKE=arch
          BUILD_ID=rolling
          ANSI_COLOR="38;2;255;105;180"
          HOME_URL="https://github.com/femboyos/femboyos"
          DOCUMENTATION_URL="https://github.com/femboyos/femboyos"
          SUPPORT_URL="https://github.com/femboyos/femboyos"
          BUG_REPORT_URL="https://github.com/femboyos/femboyos"
          LOGO=femboyos
          OSREL
          ln -sf ../usr/lib/os-release /etc/os-release

          cat << 'MOTD_IN' > /etc/motd

            ======================================================================
                         Welcome to FemboyOS Pink Edition (Astolfo GTX 750)
            ======================================================================
             Available commands:
               * femlive        - Start Pink Hyprland GUI, Waybar & BSOD Wallpaper
               * feminstall     - Launch FemboyOS Pink TUI Disk Installer
               * femboy-winrun  - Run Windows 7 / Windows 10 (.exe) applications
            ======================================================================

          MOTD_IN

          systemctl enable NetworkManager.service || true
          systemctl disable seatd.service 2>/dev/null || true
          systemctl enable libvirtd.service || true
          systemctl enable systemd-binfmt.service || true

          useradd -m -G wheel,libvirt,kvm,video,audio,input -s /bin/zsh astolfo || true
          echo "astolfo:femboy" | chpasswd
          echo "root:femboy" | chpasswd
          echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-femboyos

          mkdir -p /etc/skel/.config/hypr/custom
          rm -f /etc/skel/.config/hypr/*.lua /root/.config/hypr/*.lua 2>/dev/null || true
          if [ -f /etc/skel/.config/hypr/custom/femboy_pink.conf ]; then
              cp -f /etc/skel/.config/hypr/custom/femboy_pink.conf /etc/skel/.config/hypr/hyprland.conf
          fi

          cp -rT /etc/skel /home/astolfo
          chown -R astolfo:astolfo /home/astolfo
          cp -rT /etc/skel /root
          rm -f /home/astolfo/.config/hypr/*.lua /root/.config/hypr/*.lua 2>/dev/null || true
          chmod 0755 /usr/local/bin/femlive /usr/local/bin/feminstall /usr/local/bin/femboy-winrun 2>/dev/null || true

          mkinitcpio -P
          CUST_EOF
          sed -i 's/^          //' /tmp/femboyos-profile/airootfs/root/customize_airootfs.sh
          chmod 0755 /tmp/femboyos-profile/airootfs/root/customize_airootfs.sh

          # 5. Rebrand all Bootloader Menus & profiledef.sh
          sed -i 's/Arch Linux/FemboyOS/g' /tmp/femboyos-profile/profiledef.sh || true
          find /tmp/femboyos-profile/grub /tmp/femboyos-profile/syslinux /tmp/femboyos-profile/efiboot \
            -type f \( -name "*.cfg" -o -name "*.conf" \) \
            -exec sed -i \
              -e 's/Arch Linux install medium/FemboyOS Pink Edition (femlive \/ feminstall)/g' \
              -e 's/Arch Linux/FemboyOS/g' {} +

          # 6. Recolor BIOS Syslinux Boot Menu to Neon Pink / Magenta
          if [ -f /tmp/femboyos-profile/syslinux/archiso_head.cfg ]; then
            sed -i \
              -e 's/MENU COLOR border.*/MENU COLOR border       35;40      #ffff69b4 #00000000 std/' \
              -e 's/MENU COLOR title.*/MENU COLOR title        1;35;40    #ffffb1c8 #00000000 std/' \
              -e 's/MENU COLOR sel.*/MENU COLOR sel          7;35;40    #ffffffff #ffff1493 all/' \
              /tmp/femboyos-profile/syslinux/archiso_head.cfg
          fi

          # 7. Add Pink Theme Colors to UEFI GRUB (grub.cfg)
          if [ -f /tmp/femboyos-profile/grub/grub.cfg ]; then
            sed -i '1i set color_normal=light-magenta/black\nset color_highlight=white/magenta\n' \
              /tmp/femboyos-profile/grub/grub.cfg
          fi

          # 8. Replace Boot Splash (syslinux/splash.png) with Astolfo BSOD Wallpaper
          python3 - << 'PYEOF'
          import os
          from PIL import Image
          wall = "/tmp/femboyos-profile/airootfs/usr/share/backgrounds/femboyos/astolfo_bsod_gtx750.jpg"
          splash_out = "/tmp/femboyos-profile/syslinux/splash.png"
          if os.path.exists(wall):
              img = Image.open(wall).convert("RGBA").resize((640, 480), Image.Resampling.LANCZOS)
          else:
              img = Image.new("RGBA", (640, 480), (31, 16, 24, 255))
          overlay = Image.new("RGBA", (640, 480), (26, 10, 20, 110))
          img = Image.alpha_composite(img, overlay).convert("RGB")
          img.save(splash_out, "PNG")
          print("[+] Generated custom 640x480 Pink Astolfo splash.png for bootloader!")
          PYEOF

          # 9. Merge package lists (includes swaybg, waybar, cage, dialog, rsync; excludes archinstall!)
          {
            cat /usr/share/archiso/configs/releng/packages.x86_64
            cat archiso/packages.x86_64 2>/dev/null || true
            printf "swaybg\nwaybar\ncage\ndialog\nrsync\ngptfdisk\n"
          } | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' \
            | grep -v '^archinstall$' \
            | sort -u > /tmp/femboyos-profile/packages.x86_64

      - name: Build FemboyOS ISO with mkarchiso
        run: |
          mkdir -p /tmp/work /tmp/out
          mkarchiso -v -w /tmp/work -o /tmp/out /tmp/femboyos-profile
          ls -lh /tmp/out/

      - name: Upload FemboyOS ISO Artifact (No Checksum File, Uncompressed ZIP for WinRAR)
        uses: actions/upload-artifact@v4
        with:
          name: FemboyOS-x86_64-ISO
          path: /tmp/out/*.iso
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/out/*.iso
          generate_release_notes: true
